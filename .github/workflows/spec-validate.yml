name: "Validate features (T1)"

# Deterministic Tier-1 gate for Stage 2 output. Runs on every PR (no path
# filter) so it can serve as an always-reported REQUIRED status check on `main`
# without deadlocking PRs that don't touch the feature specs.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-features:
    name: "Validate features"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install validator dependencies
        run: pip install pyyaml jsonschema

      - id: scope
        name: Detect feature-contract changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ] || git diff --name-only "$BASE_SHA" "$HEAD_SHA" | grep -Eq '^(conventions\.yml|\.d365/spec-kit/compatibility\.yml|specs/_schema/|specs/_index/features\.md|specs/[0-9]{3}-[^/]+/spec\.md|specs/_index/repository-context\.json|\.specify/context/spec-context\.json)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check repository context
        if: steps.scope.outputs.run == 'true'
        run: python scripts/compile_repository_context.py --check

      - name: Compile check (specs in sync with REQ source)
        if: steps.scope.outputs.run == 'true'
        run: python scripts/compile_specs.py --check

      - name: Validate feature specs
        if: steps.scope.outputs.run == 'true'
        run: python scripts/validate_specs.py
