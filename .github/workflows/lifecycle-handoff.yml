name: "Create lifecycle handoffs"

on:
  pull_request:
    types: [closed]

permissions:
  contents: read
  issues: write
  pull-requests: write

# Use the configured PAT rather than GITHUB_TOKEN so newly created handoff
# issues emit normal issue events and the tracking workflow can add them to the
# Project and initialize lifecycle fields.
jobs:
  create-handoff:
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.base.ref == github.event.repository.default_branch &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.D365_PROJECT_TOKEN }}
      GITHUB_REPOSITORY: ${{ github.repository }}
      D365_BA_ASSIGNEE: ${{ vars.D365_BA_ASSIGNEE }}
      D365_ARCHITECT_ASSIGNEE: ${{ vars.D365_ARCHITECT_ASSIGNEE }}
      D365_DEV_LEAD_ASSIGNEE: ${{ vars.D365_DEV_LEAD_ASSIGNEE }}
      D365_TEST_LEAD_ASSIGNEE: ${{ vars.D365_TEST_LEAD_ASSIGNEE }}
    steps:
      - name: Require the lifecycle automation token
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::D365_PROJECT_TOKEN is required so handoff issues trigger tracking initialization."
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - name: Create the next-stage handoff draft
        run: >-
          python scripts/lifecycle_handoff.py
          --pr-number "${{ github.event.pull_request.number }}"
          --merge-sha "${{ github.event.pull_request.merge_commit_sha }}"
