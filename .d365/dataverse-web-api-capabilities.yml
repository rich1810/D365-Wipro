schema_version: 1

policy:
  mcp_solution_authoring_rationale: >-
    Generic Dataverse MCP writes do not provide a compiler-validated explicit
    custom-solution context equivalent to the operation's documented Web API
    solution mechanism; Dataverse MCP is discovery and targeted post-action
    verification only for solution-aware authoring.
  portal_fallback_evidence_required: true
  destructive_approval_required: true
  delete_semantics:
    delete: >-
      HTTP DELETE removes the metadata component or row from the environment;
      it is destructive and is never a substitute for removing solution membership.
    remove_solution_component: >-
      RemoveSolutionComponent removes only the component's membership from the
      named unmanaged solution; it does not delete the component from the environment.

