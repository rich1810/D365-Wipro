    verification: {resource: dataverse-mcp, tools: [describe, read_query], http: {method: GET, endpoint_family: entity_set, path_template: connectionreferences}, rationale: "Verify logical name, connector identity, and non-secret metadata only."}
    fallback: *portal_fallback
    executor: {supported: true, builder: integ_connection_ref}
    rationale: *mcp_rationale
    official_references: [optional_parameters, connection_reference]
  connection-reference-delete:
    support: supported
    operation: delete
    primary_resource: dataverse-web-api
    http: {method: DELETE, endpoint_family: entity_set, path_template: "connectionreferences({record_id})"}
    solution_context: {mechanism: MSCRM.SolutionUniqueName, name: MSCRM.SolutionUniqueName, value_source: authoring_target.solution_unique_name}
    verification: {resource: dataverse-mcp, tools: [describe, read_query], http: {method: GET, endpoint_family: entity_set, path_template: connectionreferences}, rationale: Confirm only the exact logical name was removed.}
    fallback: *portal_fallback
    executor: {supported: true, builder: integ_connection_ref}
    destructive_effect: environment_delete
    rationale: HTTP DELETE destroys the connection-reference row and can break consumers; it is not membership removal.
    official_references: [optional_parameters, connection_reference]
  connection-reference-verify:
    support: supported
    operation: verify
    primary_resource: dataverse-web-api
    http: {method: GET, endpoint_family: entity_set, path_template: connectionreferences}
    solution_context: {mechanism: not_applicable}
    verification: {resource: dataverse-mcp, tools: [describe, read_query], http: {method: GET, endpoint_family: entity_set, path_template: connectionreferences}, rationale: Target-read the exact logical name and non-secret connector metadata.}
    fallback: {resource: maker-portal, allowed_when: not_applicable, issue_evidence_required: false}
    executor: {supported: true, builder: integ_connection_ref}
    rationale: Targeted verification does not inspect or bind a concrete connection.
    official_references: [connection_reference]
  metadata-publish:
    support: supported
    operation: publish
    primary_resource: dataverse-web-api
    http: {method: POST, endpoint_family: unbound_action, path_template: PublishXml}
    solution_context: {mechanism: not_applicable}
    verification: {resource: dataverse-mcp, tools: [describe, read_query], rationale: Re-read only the published canonical metadata.}
    fallback: *portal_fallback
    executor: {supported: true, builder: publish_xml}
    rationale: PublishXml targets named entities or choices; PublishAllXml is prohibited.
    official_references: [publish_xml, publish_request_schema]
  add-solution-component:
    support: supported
    operation: add_solution_component
    primary_resource: dataverse-web-api
    http: {method: POST, endpoint_family: unbound_action, path_template: AddSolutionComponent}
    solution_context: {mechanism: action_parameter, name: SolutionUniqueName, value_source: authoring_target.solution_unique_name}
    verification: {resource: dataverse-mcp, tools: [describe, read_query], rationale: Verify the exact object ID is a member of only the routed custom solution among declared custom solutions.}
    fallback: *portal_fallback
    executor: {supported: true, builder: add_solution_component}
    rationale: Use only for an already-existing component; creation with MSCRM.SolutionUniqueName remains the preferred documented mechanism.
    official_references: [add_solution_component, solution_component_types]
  remove-solution-component:
    support: supported
    operation: remove_solution_component
    primary_resource: dataverse-web-api
    http: {method: POST, endpoint_family: unbound_action, path_template: RemoveSolutionComponent}
    solution_context: {mechanism: action_parameter, name: SolutionUniqueName, value_source: authoring_target.solution_unique_name}
    verification: {resource: dataverse-mcp, tools: [describe, read_query], rationale: Verify the component still exists but is no longer a member of the routed solution.}
    fallback: *portal_fallback
    executor: {supported: true, builder: remove_solution_component}
    destructive_effect: solution_membership_only
    rationale: RemoveSolutionComponent changes membership only and must never be substituted for HTTP DELETE.
    official_references: [remove_solution_component, solution_component_types]
  maker-portal-primary:
    support: unsupported_or_not_applicable
    operation: any
    primary_resource: maker-portal
    solution_context: {mechanism: not_applicable}
    verification: {resource: dataverse-mcp, tools: [describe, read_query], rationale: Use targeted Dataverse reads after the human authoring step.}
    fallback: {resource: maker-portal, allowed_when: not_applicable, issue_evidence_required: false}
    executor: {supported: false, builder: unsupported}
    rationale: No documented compiler-reliable Web API payload contract is claimed for this component; the visual product authoring surface remains primary.
    official_references: [maker_solutions]
  documented-form-not-reliable:
    support: documented_but_not_compiler_reliable
    operation: any
    primary_resource: maker-portal
    solution_context: {mechanism: not_applicable}
    verification: {resource: dataverse-mcp, tools: [describe, read_query], rationale: Verify exact form metadata after portal authoring.}
    fallback: {resource: maker-portal, allowed_when: not_applicable, issue_evidence_required: false}
    executor: {supported: false, builder: unsupported}
    rationale: SystemForm CRUD is documented, but the current required payload cannot safely construct or merge complete FormXml/FormJson and role/order dependencies.
    official_references: [system_form, optional_parameters]
  documented-flow-not-reliable:
    support: documented_but_not_compiler_reliable
    operation: any
    primary_resource: maker-portal
    solution_context: {mechanism: not_applicable}
    verification: {resource: dataverse-mcp, tools: [describe, read_query], rationale: Verify the exact workflow identity and runtime outcome after supported visual authoring.}
    fallback: {resource: maker-portal, allowed_when: not_applicable, issue_evidence_required: false}
    executor: {supported: false, builder: unsupported}
    rationale: Workflow row CRUD is documented, but Microsoft does not document the complete cloud-flow clientdata construction contract required for safe compiler authoring.
    official_references: [workflow, optional_parameters]
  documented-role-not-reliable:
    support: documented_but_not_compiler_reliable
    operation: any
    primary_resource: maker-portal
    solution_context: {mechanism: not_applicable}
    verification: {resource: dataverse-mcp, tools: [describe, read_query], rationale: Verify the exact role and effective privileges after human least-privilege review.}
    fallback: {resource: maker-portal, allowed_when: not_applicable, issue_evidence_required: false}
    executor: {supported: false, builder: unsupported}
    rationale: Role CRUD and privilege actions are documented, but canonical role identity, base-role copy, business-unit scoping, and privilege resolution are not safely derivable from the current payload.
    official_references: [security_role, optional_parameters]
  pac-primary:
    support: unsupported_or_not_applicable
    operation: any
    primary_resource: power-platform-cli
    solution_context: {mechanism: not_applicable}
    verification: {resource: dataverse-mcp, tools: [describe, read_query], rationale: "Use targeted Dataverse verification after supported PAC source, package, or registration operations."}
    fallback: {resource: maker-portal, allowed_when: not_applicable, issue_evidence_required: false}
    executor: {supported: false, builder: unsupported}
    rationale: PAC remains primary only for its documented source, package, registration, and solution operations; generic component creation is not claimed.
    official_references: [power_platform_cli]
  mcp-environment-primary:
    support: unsupported_or_not_applicable
    operation: any
    primary_resource: dataverse-mcp
    solution_context: {mechanism: not_applicable}
    verification: {resource: dataverse-mcp, tools: [describe, read_query], rationale: Environment-bound records do not require custom-solution context.}
    fallback: {resource: maker-portal, allowed_when: documented_operation_unsupported_or_primary_unavailable, issue_evidence_required: true}
    executor: {supported: false, builder: unsupported}
    rationale: This component is environment-bound rather than solution-bound, so the explicit custom-solution Web API routing rule does not apply.
    official_references: [dataverse_rows, dataverse_mcp]
  admin-center-primary:
    support: unsupported_or_not_applicable
    operation: any
    primary_resource: power-platform-admin-center
    solution_context: {mechanism: not_applicable}
    verification: {resource: dataverse-mcp, tools: [describe, read_query], rationale: Verify only the configured audit scope after the administrator action.}
    fallback: {resource: power-platform-admin-center, allowed_when: not_applicable, issue_evidence_required: false}
    executor: {supported: false, builder: unsupported}
    rationale: Environment audit administration is not a custom-solution authoring operation.
    official_references: [audit_administration]
  copilot-studio-primary:
    support: unsupported_or_not_applicable
    operation: any
    primary_resource: copilot-studio-authoring
    solution_context: {mechanism: not_applicable}
    verification: {resource: dataverse-mcp, tools: [describe, read_query], rationale: Use targeted Dataverse grounding and published-agent verification only.}
    fallback: {resource: copilot-studio-authoring, allowed_when: not_applicable, issue_evidence_required: false}
    executor: {supported: false, builder: unsupported}
    rationale: Copilot Studio artifacts require the registered product-specific authoring resource; no generic Dataverse Web API authoring claim is made.
    official_references: [copilot_studio]
  repository-native:
    support: unsupported_or_not_applicable
    operation: any
    primary_resource: repository
    solution_context: {mechanism: not_applicable}
    verification: {resource: repository, rationale: Use the component's native repository build and validation tools.}
    fallback: {resource: repository, allowed_when: not_applicable, issue_evidence_required: false}
    executor: {supported: false, builder: unsupported}
    rationale: The component is repository-only and outside Dataverse Web API routing.
    official_references: [azure_resource_manager]
  power-bi-native:
    support: unsupported_or_not_applicable
    operation: any
    primary_resource: power-bi-rest-api
    solution_context: {mechanism: not_applicable}
    verification: {resource: power-bi-rest-api, rationale: Verify through the registered Power BI resources.}
    fallback: {resource: power-bi-rest-api, allowed_when: not_applicable, issue_evidence_required: false}
    executor: {supported: false, builder: unsupported}
    rationale: The component is a Power BI artifact and outside Dataverse Web API routing.
    official_references: [power_bi_rest]

